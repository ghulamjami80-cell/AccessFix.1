<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AccessFix AI Studio</title>
<style>
:root{--bg:#121212;--panel:#1c1c1e;--chip:#2a2a2d;--line:#333;--tx:#f2f2f2;--mut:#8e8e93;--acc:#00d1f0;--acc2:#6d5dfc;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
/* Keep file inputs rendered: iOS Safari may ignore clicks on display:none inputs. */
.file-picker{position:fixed!important;left:-10000px!important;top:0!important;width:1px!important;height:1px!important;opacity:.01!important;display:block!important;pointer-events:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.scr{position:fixed;inset:0;max-width:760px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);background:var(--bg)}
.top{display:flex;align-items:center;gap:8px;padding:8px 14px}.top .sp,.sp{flex:1}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none}
.ib:disabled{color:#555}
.exp{background:var(--acc);color:#001a1f;border-radius:10px;padding:10px 18px;font-weight:700}
.pill{background:var(--chip);border-radius:10px;padding:10px 14px;font-weight:600}
.stage{flex:1;min-height:0;position:relative}
.stage canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000;border-radius:3px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:4px 14px;gap:8px}
.bar .ib{font-size:24px}
.small{font-size:13px;color:var(--mut);padding:8px 12px;border-radius:10px;background:var(--chip);user-select:none;-webkit-user-select:none}
.tabs{display:flex;align-items:center;gap:22px;padding:10px 16px 0;background:var(--panel);border-top:1px solid #000;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:6px 0 10px;font-size:17px;color:var(--mut);flex:none;border-bottom:3px solid transparent}
.tabs button.on{color:var(--tx);font-weight:600;border-color:var(--acc)}
.tabs .ok{font-size:26px;color:var(--tx);border:0}
.pn{background:var(--panel);height:42vh;overflow-y:auto;padding:8px 0 12px;-webkit-overflow-scrolling:touch}
.pn.auto{height:auto;max-height:42vh}
.row{display:flex;gap:8px;overflow-x:auto;padding:4px 14px;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--chip);border-radius:10px;padding:10px 14px;font-size:14px;white-space:nowrap;min-height:40px}
.chip.on{background:var(--acc);color:#001a1f;font-weight:700}
.cat{flex:none;padding:8px 10px;color:var(--mut);font-size:17px;white-space:nowrap}
.cat.on{color:var(--tx);font-weight:700}
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 10px;padding:10px 14px}
.ft{display:block;width:100%;border-radius:10px;overflow:hidden;background:#333;text-align:center;border:2px solid transparent}
.ft canvas{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.ft span{display:block;font-size:12px;padding:6px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft.none{aspect-ratio:4/5.9;display:grid;place-items:center;font-size:34px;color:#ccc}
.ft.on{border-color:#fff}
.sl{display:flex;align-items:center;gap:12px;padding:8px 18px}
.sl label{width:92px;font-size:13px;color:var(--mut);flex:none}
.sl output{width:46px;text-align:right;color:var(--acc);font-weight:600;font-variant-numeric:tabular-nums;font-size:13px}
.sl select,.sl textarea,.sl input[type=text]{flex:1;background:var(--chip);border:0;border-radius:8px;padding:8px;min-width:0}
input[type=range]{flex:1;accent-color:var(--acc);height:32px;min-width:0}
input[type=color]{width:44px;height:34px;border:0;background:none;padding:0}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 18px;font-size:14px;border-bottom:1px solid var(--line)}
.li small{display:block;color:var(--mut);font-size:12px;margin-top:2px;line-height:1.4}
.tag{flex:none;font-size:11px;padding:4px 8px;border-radius:8px;background:var(--chip);color:var(--mut)}.tag.ok{background:#00d1f022;color:var(--acc)}
/* home */
#hbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hero{padding:22px 18px 70px;background:linear-gradient(180deg,#1d63e0 0%,#2c3f78 55%,var(--bg) 100%)}
.hero h1{font-size:28px;line-height:1.15;margin:30px 0 8px;max-width:16ch}
.hero p{margin:0;color:#dbe6ff;max-width:34ch}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px;margin-top:-48px}
.card{background:#ffffff22;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #ffffff22;border-radius:22px;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:19px;font-weight:600}
.card b{width:44px;height:44px;border-radius:12px;background:#fff;color:#111;display:grid;place-items:center;font-size:24px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:18px 16px 6px}
.g4 button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;text-align:center}
.g4 b{width:100%;aspect-ratio:1.25;border-radius:16px;background:#ffffff14;display:grid;place-items:center;font-size:26px;font-weight:400}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 4px;font-size:22px;margin:0}
.pr{display:flex;gap:14px;padding:10px 16px;align-items:center}
.pr img{width:76px;height:76px;object-fit:cover;border-radius:10px;background:#222;flex:none}
.pr div{flex:1;min-width:0}.pr strong{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pr small{color:var(--mut)}
.hnav{display:flex;border-top:1px solid var(--line);background:var(--bg)}
.hnav button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mut)}
.hnav button span{font-size:22px}.hnav .on{color:var(--tx);font-weight:700}
/* video */
.tlw{position:relative;height:178px;background:var(--bg);border-top:1px solid #000}
#tl{position:absolute;inset:0;overflow:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tl::-webkit-scrollbar{display:none}
#tin{position:relative;min-height:100%}
.ph-line{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff;z-index:3;pointer-events:none}
.rul{height:22px;position:relative;font-size:11px;color:var(--mut)}.rul i{position:absolute;top:2px;font-style:normal;transform:translateX(-50%)}
.trk{position:relative;height:50px;margin-top:6px}.trk.s{height:34px}
.blk{position:absolute;top:0;bottom:0;border-radius:8px;overflow:hidden;font-size:11px;padding:3px 6px;border:2px solid transparent;white-space:nowrap;background-size:auto 100%;background-repeat:repeat-x;touch-action:none;color:#fff;text-shadow:0 1px 2px #000}
.blk.v{background-color:#3a3a40}.blk.a{background:#1f6f5a}.blk.t{background:#6d5dfc}.blk.k{background:#a8458f}
.blk.sel{border-color:#fff}
.add{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;padding:0 14px;background:#2a2a2d;border-radius:8px;color:var(--mut);font-size:14px;min-width:200px;white-space:nowrap;position:sticky}
.tools{display:flex;overflow-x:auto;background:var(--bg);border-top:1px solid var(--line);scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools button{flex:none;min-width:76px;padding:9px 8px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.tools button span{font-size:22px}.tools button.on{color:var(--acc)}
.eg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:8px 14px;font-size:28px}.eg button{height:46px;border-radius:10px;background:var(--chip)}
#sheet,#vsheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.on,#vsheet.on{display:flex}
.box{background:var(--panel);width:100%;max-width:760px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0))}
.box h2{margin:0 0 10px;font-size:18px}
.f{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0}
.f select{background:var(--chip);border:0;border-radius:8px;padding:10px;min-width:150px}
.note{font-size:12px;color:var(--mut);line-height:1.5;margin:6px 0 10px}
.msg{min-height:20px;font-size:13px;color:var(--acc);margin:4px 0 8px}.msg.err{color:#ff6b6b}
progress{width:100%;accent-color:var(--acc)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;border:1px solid #444;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;display:none;max-width:90vw;text-align:center}
#toast.on{display:block}
#pool{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;overflow:hidden}
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="scr"><div id="hbody"></div>
 <nav class="hnav" id="hnav"></nav></div>

<!-- PHOTO -->
<div id="photo" class="scr" hidden>
 <div class="top"><button class="ib" id="pclose" aria-label="Close photo">✕</button><span class="sp"></span><button class="exp" id="pexp">Export</button></div>
 <div class="stage" id="pstage"><canvas id="cv" aria-label="Photo preview"></canvas></div>
 <div class="bar"><button class="ib" id="un" aria-label="Undo">↶</button><button class="small" id="cmp">Hold to compare</button><button class="ib" id="re" aria-label="Redo">↷</button></div>
 <div class="tabs" id="ptabs"></div>
 <div class="pn" id="ppanel"></div>
</div>

<!-- VIDEO -->
<div id="video" class="scr" hidden>
 <div class="top"><button class="ib" id="vclose" aria-label="Close project">✕</button><span class="sp"></span><button class="exp" id="vexp">Export</button></div>
 <div class="stage" id="vstage"><canvas id="vc" aria-label="Video preview"></canvas></div>
 <div class="bar"><button class="ib" id="vfs" aria-label="Zoom timeline out">−</button><button class="ib" id="vplay" aria-label="Play or pause">▶</button><button class="ib" id="vfp" aria-label="Zoom timeline in">＋</button><span class="small" id="tm">00:00 / 00:00</span><span class="sp"></span><button class="ib" id="vun" aria-label="Undo">↶</button><button class="ib" id="vre" aria-label="Redo">↷</button></div>
 <div class="tlw"><div id="tl"><div id="tin"></div></div><div class="ph-line"></div></div>
 <div class="tabs" id="vtabs" hidden></div>
 <div class="pn auto" id="vpanel" hidden></div>
 <div class="tools" id="vtools"></div>
</div>

<!-- sheets -->
<div id="sheet"><div class="box" role="dialog" aria-label="Export photo">
 <h2>Export photo</h2>
 <div class="f"><label for="xf">Format</label><select id="xf"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div>
 <div class="f"><label for="xs">Size</label><select id="xs"><option value="1">Original</option><option value="2">2× resize</option><option value="4">4× resize</option><option value="u">4K (3840 px long edge)</option></select></div>
 <div class="f"><label for="xq">Quality <output id="xqo">90</output></label><input type="range" id="xq" min="40" max="100" value="90"></div>
 <p class="note" id="xn"></p><div class="msg" id="msg" role="status"></div>
 <div style="display:flex;gap:10px"><button class="pill" id="xc" style="flex:1">Cancel</button><button class="exp" id="xd" style="flex:2">Download</button></div>
</div></div>
<div id="vsheet"><div class="box" role="dialog" aria-label="Export video">
 <h2>Export video</h2>
 <div class="f"><label for="vr">Resolution</label><select id="vr"><option value="720">720p</option><option value="1080">1080p Full HD</option></select></div>
 <div class="f"><label for="vf">Frame rate</label><select id="vf"><option>24</option><option selected>30</option><option>60</option></select></div>
 <div class="f"><label for="vb">Quality</label><select id="vb"><option value="2500000">Small file</option><option value="5000000" selected>Balanced</option><option value="10000000">High</option></select></div>
 <p class="note" id="vn">Export records the timeline in real time, so it takes as long as the video plays. Keep this tab open. 4K export is not offered: browsers can’t record it reliably.</p>
 <progress id="vp" value="0" max="1" hidden></progress><div class="msg" id="vm" role="status"></div>
 <div style="display:flex;gap:10px"><button class="pill" id="vxc" style="flex:1">Close</button><button class="exp" id="vxd" style="flex:2">Export</button></div>
</div></div>

<div id="toast" role="status"></div><div id="pool"></div>
<input type="file" id="fp" class="file-picker" accept="image/*" aria-label="Choose photo">
<input type="file" id="fv" class="file-picker" accept="video/*,image/*,.mp4,.mov,.m4v,.webm,.jpg,.jpeg,.png,.webp,.heic,.heif" multiple aria-label="Choose videos or photos">
<input type="file" id="fa" class="file-picker" accept="audio/*,video/*,.mp3,.m4a,.wav,.aac,.mp4,.mov" aria-label="Choose audio">
<input type="file" id="fs" class="file-picker" accept=".srt,text/plain" aria-label="Choose captions">

<script>
const $=s=>document.querySelector(s);
const wd=o=>o.naturalWidth||o.videoWidth||o.width||0,hg=o=>o.naturalHeight||o.videoHeight||o.height||0;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const fmt=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2800)}
const MOB=/Mobi|iPhone|Android/i.test(navigator.userAgent),CAP=MOB?3072:4096;
function show(id){document.querySelectorAll('.scr').forEach(s=>s.hidden=s.id!==id)}
function pick(inp,cb){if(!inp)return toast('File picker is unavailable. Reload the page and try again.');inp.onchange=()=>{const f=Array.from(inp.files||[]);inp.value='';if(f.length){Promise.resolve(cb(f)).catch(e=>{console.error(e);toast('Could not import this file. Try another supported file.')} )}};try{inp.click()}catch(e){console.error(e);toast('Could not open the file picker. Try opening the website in Safari.')}}

/* ===== storage ===== */
const DB=new Promise((ok,no)=>{try{const r=indexedDB.open('afx',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});
async function dbx(m,...a){const d=await DB;return new Promise((ok,no)=>{const q=d.transaction('p',m==='getAll'||m==='get'?'readonly':'readwrite').objectStore('p')[m](...a);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
const logDl=(n,sz)=>{try{const l=JSON.parse(localStorage.getItem('afx_dl')||'[]');l.unshift({n,sz,d:Date.now()});localStorage.setItem('afx_dl',JSON.stringify(l.slice(0,30)))}catch(e){}};
function saveBlob(b,name){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);logDl(name,b.size)}

/* ===== image engine ===== */
const ADJ=[['brightness','Brightness'],['contrast','Contrast'],['saturation','Saturation'],['exposure','Exposure'],['temperature','Temperature'],['tint','Tint'],['highlights','Highlights'],['shadows','Shadows'],['sharpness','Sharpness',1],['clarity','Clarity',1],['fade','Fade',1],['vignette','Vignette',1],['grain','Grain',1],['blur','Blur',1],['smooth','Skin smoothing',1],['red','Red'],['green','Green'],['blue','Blue']];
const FL=[
['Y2K Blue','Featured Retro',{temperature:-30,saturation:30,contrast:15,fade:10,tint:-10}],['4K','Featured Landscape',{clarity:50,sharpness:40,saturation:20,contrast:12}],['Bokeh','Featured Portrait',{smooth:30,brightness:8,vignette:25,saturation:10}],['Noir Flash','Featured B&W',{mono:1,contrast:35,brightness:10,vignette:20}],['Hollywood Past','Featured Vintage',{fade:30,temperature:30,saturation:-15,contrast:15,grain:20}],['Clear II','Featured Natural',{brightness:6,saturation:15,clarity:30,temperature:-8}],['Crystal Touch','Featured Beauty',{smooth:35,brightness:12,temperature:8,contrast:-5,saturation:8}],
['Spooky','Halloween Dramatic',{contrast:35,saturation:-30,temperature:-20,tint:10,vignette:50,shadows:-25}],['Pumpkin','Halloween Warm',{temperature:55,saturation:35,contrast:20,vignette:30}],['Midnight','Halloween Cool',{temperature:-40,brightness:-15,contrast:25,vignette:40}],
['Cinematic','NEW Cinematic',{contrast:20,saturation:-10,temperature:-15,shadows:15,vignette:30,tint:5}],['HDR','NEW HDR',{contrast:25,clarity:60,highlights:-40,shadows:40,saturation:20}],['Teal Orange','NEW Cinematic Hits',{temperature:15,tint:-12,contrast:22,saturation:18,vignette:18}],
['Portrait','Hits Portrait',{brightness:8,saturation:5,temperature:10,sharpness:20,vignette:10}],['Glow Skin','Hits Beauty',{smooth:50,brightness:14,temperature:6,fade:8}],['Social','Hits Social',{brightness:10,saturation:25,contrast:10}],
['Natural','Life Natural',{saturation:8,contrast:6}],['Fresh','Life Natural',{brightness:10,saturation:18,temperature:-6}],['Daily','Life Social',{brightness:5,contrast:8,saturation:12}],
['Vintage','Vintage',{fade:40,temperature:25,saturation:-20,grain:30,vignette:25}],['Retro','Retro',{fade:30,temperature:30,tint:15,saturation:15,contrast:10}],['Black & White','B&W',{mono:1,contrast:20}],['Warm','Warm',{temperature:40,saturation:10}],['Cool','Cool',{temperature:-40,saturation:5}],['Sunset','Sunset',{temperature:50,tint:20,saturation:25,vignette:15}],['Film','Film',{fade:25,contrast:15,grain:35,saturation:-8}],['Landscape','Landscape',{saturation:30,clarity:40,contrast:15}],['Dramatic','Dramatic',{contrast:45,shadows:-30,saturation:-15,vignette:45,clarity:40}],['Soft glow','Soft_Glow',{fade:15,brightness:15,contrast:-10,saturation:5}]];
const FIL={None:{}};FL.forEach(f=>FIL[f[0]]=f[2]);
const CATS=['Featured','Halloween','NEW','Hits','Life','Cinematic','HDR','Portrait','Beauty','Natural','Vintage','Retro','B&W','Warm','Cool','Sunset','Film','Landscape','Social','Dramatic','Soft_Glow'];
const RATIOS={Free:0,'1:1':1,'9:16':9/16,'16:9':16/9,'4:5':4/5};
const blank=()=>({adj:{},fil:'None',inten:100,rot:0,fh:false,fv:false,ratio:'Free'});
function pass(a,b,n,m,sx,sy,r){for(let j=0;j<m;j++){const o=j*sy;for(let c=0;c<4;c++){let s=0;for(let i=-r;i<=r;i++)s+=a[o+Math.min(n-1,Math.max(0,i))*sx+c];const W=2*r+1;for(let i=0;i<n;i++){b[o+i*sx+c]=s/W;s+=a[o+Math.min(n-1,i+r+1)*sx+c]-a[o+Math.max(0,i-r)*sx+c]}}}}
function blurPx(d,w,h,r){r=Math.round(r);if(r<1)return d.slice();const t=new Uint8ClampedArray(d.length),o=new Uint8ClampedArray(d.length);pass(d,t,w,h,4,w*4,r);pass(t,o,h,w,w*4,4,r);return o}
function eff(s){const e={};for(const [k] of ADJ)e[k]=(s.adj&&s.adj[k])||0;const f=FIL[s.fil]||{},t=(s.inten??100)/100;for(const k in f){if(k!=='mono')e[k]=(e[k]||0)+f[k]*t}e.mono=f.mono?t:0;if(s.keys)for(const k in e)if(k!=='mono'&&!s.keys.includes(k))e[k]=0;return e}
function dims(src,s){const W=wd(src),H=hg(src),rot=s.rot%180!==0,rw=rot?H:W,rh=rot?W:H;let cx=0,cy=0,cw=rw,ch=rh;const q=RATIOS[s.ratio];if(q){if(cw/ch>q){cw=Math.round(ch*q);cx=Math.round((rw-cw)/2)}else{ch=Math.round(cw/q);cy=Math.round((rh-ch)/2)}}return{rw,rh,cx,cy,cw,ch}}
function render(src,L,s,canvas){const D=dims(src,s),k=L/Math.max(D.cw,D.ch),w=Math.max(1,Math.round(D.cw*k)),h=Math.max(1,Math.round(D.ch*k));
 const c=canvas||document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';
 x.save();x.translate(-D.cx*k,-D.cy*k);x.translate(D.rw*k/2,D.rh*k/2);x.rotate(s.rot*Math.PI/180);x.scale(s.fh?-1:1,s.fv?-1:1);x.drawImage(src,-wd(src)*k/2,-hg(src)*k/2,wd(src)*k,hg(src)*k);x.restore();
 const e=eff(s);if(!Object.keys(e).some(q=>e[q]))return c;
 const id=x.getImageData(0,0,w,h);let d=id.data;const sc=Math.max(w,h)/1000;
 if(e.smooth>0){const b=blurPx(d,w,h,3*sc+1),t=Math.min(1,e.smooth/100);for(let i=0;i<d.length;i+=4){d[i]+=(b[i]-d[i])*t;d[i+1]+=(b[i+1]-d[i+1])*t;d[i+2]+=(b[i+2]-d[i+2])*t}}
 if(e.blur>0)d=blurPx(d,w,h,e.blur/100*14*sc);

 rec.onstop=()=>{const was=exporting;exporting=false;vsize();$('#vp').hidden=true;$('#vxd').textContent='Export';if(!rec.cancel&&ch.length){const b=new Blob(ch,{type:rec.mimeType||mt||'video/webm'}),ext=/mp4/.test(b.type)?'mp4':'webm';saveBlob(b,`${vname}-accessfix.${ext}`);$('#vm').className='msg';$('#vm').textContent=`Done: ${(b.size/1048576).toFixed(1)} MB · ${W} × ${H} px · ${ext.toUpperCase()}`+(ext==='webm'?'. This browser saves WebM, not MP4.':'')}else if(was&&!rec.cancel){$('#vm').className='msg err';$('#vm').textContent='Export produced no data. Try a shorter project or lower resolution.'}};
 $('#vp').hidden=false;$('#vxd').textContent='Exporting…';rec.start(1000);play()};
function finishExport(){if(rec&&rec.state!=='inactive')rec.stop()}
function cancelExport(){if(rec){rec.cancel=true;if(rec.state!=='inactive')rec.stop()}stopP();exporting=false;vsize();$('#vm').textContent='Export cancelled.'}
/* video open/close/save */
function openVideo(state,files,id,name){V=state||V0();M={};vid=id||'v'+Date.now();vname=name||'Project '+new Date().toLocaleDateString();T=0;vsel=null;vtool=null;vh=[];vhi=-1;playing=false;exporting=false;show('video');$('#vplay').textContent='▶';vsize();vp();
 const go=async()=>{if(files)for(const k in files){try{await mk(files[k].file,k,files[k].a)}catch(e){toast('A saved clip could not be reloaded.')}}snapV();vsize();tl_();setT(0)};go();cancelAnimationFrame(vraf);vraf=requestAnimationFrame(loop)}
async function saveVideo(close){if(!V.clips.length){if(close)goHome();return}const files={};for(const k in M)files[k]={file:M[k].file,a:M[k].kind==='audio'};const f=V.clips[0],pcm=M[f.m]&&M[f.m].poster;
 try{await dbx('put',{id:vid,type:'video',name:vname,date:Date.now(),thumb:pcm||'',files,V,info:`${fmt(total())}`});toast('Project saved')}catch(e){toast('Could not save: browser storage is unavailable.')}if(close)goHome()}
$('#vclose').onclick=()=>{stopP();if(V.clips.length&&confirm('Save this project before closing?\nOK = save, Cancel = discard'))return saveVideo(true);goHome()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing&&!exporting)stopP()});

/* ===== home ===== */
let hTab='edit';
const HN=[['edit','✂','Edit'],['tpl','▯','Templates'],['ai','✧','AI Lab'],['lib','▤','Library'],['me','☺','Me']];
$('#hnav').innerHTML=HN.map(t=>`<button data-t="${t[0]}"><span>${t[1]}</span>${t[2]}</button>`).join('');
$('#hnav').onclick=e=>{const b=e.target.closest('button');if(b)home(b.dataset.t)};
function goHome(){for(const k in M)try{M[k].el.pause&&M[k].el.pause()}catch(e){}cancelAnimationFrame(vraf);playing=false;img=null;show('home');home(hTab)}
const newPhoto=p=>{pre=p||null;pick($('#fp'),f=>loadPhoto(f[0]))};
const newVideo=()=>{openVideo();pick($('#fv'),addMedia)};
async function home(t){hTab=t||hTab;document.querySelectorAll('#hnav button').forEach(b=>b.classList.toggle('on',b.dataset.t===hTab));const B=$('#hbody');B.scrollTop=0;
 if(hTab==='edit'){const tools=[['Post template','▶',()=>toast('Templates need an online template library. Not connected.')],['AutoCut','⚡',()=>toast('AutoCut needs a backend AI service. Not connected.')],['Retouch','◎',()=>newPhoto({fil:'Beauty'})],['AI generator','✧',()=>home('ai')],['Auto captions','CC',()=>{newVideo();setTimeout(()=>{vtool='cap';vp()},50)}],['Photo editor','▣',()=>newPhoto()],['Cover maker','✎',()=>toast('Cover maker is not built yet.')],['All tools','⠿',()=>home('ai')]];
  B.innerHTML=`<div class="hero"><div class="brand" style="font-weight:700">AccessFix AI Studio</div><h1>Transform Your Photos &amp; Videos with AI</h1><p>Enhance, edit, and export stunning visuals in HD and 4K quality.</p></div>
  <div class="cards"><button class="card" id="nv"><b>＋</b>New video</button><button class="card" id="np"><b>▣</b>Edit photo</button></div>
  <div class="row" style="padding:14px 16px 0"><button class="chip" id="n4">Enhance to 4K</button></div>
  <div class="g4">${tools.map((t,i)=>`<button data-i="${i}"><b>${t[1]}</b>${t[0]}</button>`).join('')}</div>
  <h2 class="ph">Projects</h2><div id="plist"><p class="note" style="padding:0 18px">Loading…</p></div>`;
  $('#nv').onclick=newVideo;$('#np').onclick=()=>newPhoto();$('#n4').onclick=()=>newPhoto({size:'u'});B.querySelector('.g4').onclick=e=>{const b=e.target.closest('[data-i]');if(b)tools[b.dataset.i][2]()};
  try{const l=(await dbx('getAll')).sort((a,b)=>b.date-a.date);$('#plist').innerHTML=l.length?l.map(p=>`<div class="pr" data-id="${p.id}" role="button" tabindex="0"><img alt="" src="${p.thumb||''}"><div><strong>${esc(p.name)}</strong><small>${new Date(p.date).toLocaleString()}<br>${p.type==='video'?'Video · '+p.info:'Photo · '+p.info}</small></div><button class="ib" data-m="${p.id}" aria-label="Rename or delete project">⋯</button></div>`).join(''):'<p class="note" style="padding:0 18px">No projects yet. Start with New video or Edit photo.</p>';
   $('#plist').onclick=async e=>{const m=e.target.closest('[data-m]'),r=e.target.closest('.pr');if(m){e.stopPropagation();const p=l.find(x=>x.id===m.dataset.m),n=prompt('Type a new name, or type DELETE to remove this project.',p.name);if(n===null)return;if(n==='DELETE'){await dbx('delete',p.id)}else if(n.trim()){p.name=n.trim();await dbx('put',p)}home();return}
    if(r){const p=l.find(x=>x.id===r.dataset.id);if(p.type==='photo'){fname=p.name;loadPhoto(new File([p.blob],p.name,{type:p.blob.type}),p.S,p.id)}else openVideo(p.V,p.files,p.id,p.name)}}}catch(e){$('#plist').innerHTML='<p class="note" style="padding:0 18px">Saved projects are unavailable in this browser mode.</p>'}}
 else if(hTab==='tpl'){B.innerHTML=`<h2 class="ph">Templates</h2><p class="note" style="padding:0 18px">Video templates need an online library, which isn’t connected. These photo looks work now: pick one, then choose a photo.</p><div class="fg" id="tg"></div>`;
  $('#tg').innerHTML=FL.slice(0,12).map(f=>`<button class="ft" data-n="${esc(f[0])}"><span style="padding:30px 2px;background:hsl(${[...f[0]].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360} 40% 32%)">${esc(f[0])}</span></button>`).join('');$('#tg').onclick=e=>{const b=e.target.closest('.ft');if(b)newPhoto({fil:b.dataset.n})}}
 else if(hTab==='ai'){B.innerHTML=`<h2 class="ph">AI Lab</h2><div style="padding-top:8px">${aiList()}</div><p class="note" style="padding:12px 18px">Features marked “Needs setup” must run on a server you control. Keep API keys on that server, never in this file, and tell users before any photo or video is sent to an outside service.</p>`}
 else if(hTab==='lib'){let l=[];try{l=JSON.parse(localStorage.getItem('afx_dl')||'[]')}catch(e){}B.innerHTML=`<h2 class="ph">Library</h2><p class="note" style="padding:0 18px">Download history</p>`+(l.length?l.map(x=>`<div class="li"><div>${esc(x.n)}<small>${new Date(x.d).toLocaleString()}</small></div><span class="tag">${(x.sz/1048576).toFixed(2)} MB</span></div>`).join(''):'<p class="note" style="padding:0 18px">No downloads yet.</p>')}
 else{B.innerHTML=`<h2 class="ph">Me</h2><div class="li"><div>Privacy<small>Photos and videos are processed in this browser and saved only on this device. Nothing is uploaded.</small></div></div><div class="li"><div>Accounts and cloud sync<small>Need a secure backend and database. Not included in this file.</small></div><span class="tag">Needs setup</span></div><div class="li"><div>Clear all saved projects and history</div><button class="chip" id="clr">Clear</button></div>`;
  $('#clr').onclick=async()=>{if(!confirm('Delete all saved projects and download history on this device?'))return;try{const l=await dbx('getAll');for(const p of l)await dbx('delete',p.id);localStorage.removeItem('afx_dl')}catch(e){}toast('Cleared')}}}
ub();uv();show('home');home('edit');
</script>
